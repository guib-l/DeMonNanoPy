[pytest]
# Répertoires où pytest va chercher les tests
testpaths = test

# Pattern de fichiers de test
python_files = test_*.py

# Marqueurs personnalisés
markers =
    optional: tests facultatifs (exécutés seulement avec --run-optional)
    beta: tests facultatifs (exécutés seulement avec --beta)
    bird: tests facultatifs (exécutés seulement avec --bird)
    dftbplus: tests facultatifs (exécutés seulement avec --dftbplus)
    forces: tests facultatifs (exécutés seulement avec --forces)
    slow: tests longs à exécuter
    api: tests dépendant d'une API externe

# Options par défaut (optionnel)
addopts = -ra
