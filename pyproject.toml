[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DeMonNanoPy"
dynamic = ["version"]
description = "Python wrapper around deMonNano for preparing inputs, launching calculations, and parsing results."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hysfard" }
]
keywords = ["demonnano", "chemistry", "dftb", "ase", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.4.0",
    "ase>=3.20.0",
    "pytest>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.20"
]

[project.urls]
Homepage = "https://github.com/guib-l/DeMonNanoPy"
Repository = "https://github.com/guib-l/DeMonNanoPy"
Issues = "https://github.com/guib-l/DeMonNanoPy/issues"
Changelog = "https://github.com/guib-l/DeMonNanoPy/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "deMonPy.__version__" }

[tool.setuptools.packages.find]
include = ["deMonPy", "deMonPy.*"]

[tool.setuptools.package-data]
deMonPy = ["parameters.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start conservative: pyflakes (F) + a subset of pycodestyle (E) + isort (I).
# Broaden this list once the codebase has been formatted once.
select = ["E", "F", "I"]
ignore = []